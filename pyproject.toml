[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hls2strm"
version = "0.1.0"
description = "抓取 Jable、MissAV、SupJav、JavGuru、JAVMost 影片并生成 Emby/Jellyfin 可用的 strm，多源择优，带 Web 控制台"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "curl_cffi>=0.16.3,<0.17",
  "selectolax>=0.3.27",
  "aiosqlite>=0.20",
  "pillow>=10",
  "croniter>=6,<7",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
hls2strm = "hls2strm.__main__:main"

[tool.setuptools.packages.find]
include = ["hls2strm*"]

[tool.setuptools.package-data]
# static/ 是 web/ 的构建产物（npm run build），不进 git
hls2strm = ["static/*", "static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
