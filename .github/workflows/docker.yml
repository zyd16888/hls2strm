name: 构建镜像

# 推送到默认分支：测试通过后构建 nightly（标签 nightly 和 nightly-<短 sha>）
# 推送 v* tag：测试通过后构建 tag 同名版本，并更新 latest
# 手动运行（workflow_dispatch）选其他分支：构建分支同名标签（/ 换成 -）和 dev-<短 sha>，不动 nightly、latest
# PR：只跑测试（Python 测试 + 前端类型检查和构建）
# 镜像是单个容器：Dockerfile 里先编前端，产物放进 Python 包的 static/，由同一个服务提供
on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: 安装依赖
        run: pip install -e ".[dev]"
      - name: 测试
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装依赖
        run: npm ci --no-audit --no-fund
      - name: 类型检查并构建
        run: npm run build

  image:
    needs: [test, web]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: 计算镜像名和版本号
        id: ver
        run: |
          # ghcr 镜像名必须小写
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "main=false" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_NAME}" = "main" ] || [ "${GITHUB_REF_NAME}" = "master" ]; then
            echo "version=nightly-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "main=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "main=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 生成标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ver.outputs.image }}
          tags: |
            type=raw,value=nightly,enable=${{ steps.ver.outputs.main == 'true' }}
            type=sha,prefix=nightly-,format=short,enable=${{ steps.ver.outputs.main == 'true' }}
            type=ref,event=branch,enable=${{ github.ref_type == 'branch' && steps.ver.outputs.main != 'true' }}
            type=sha,prefix=dev-,format=short,enable=${{ github.ref_type == 'branch' && steps.ver.outputs.main != 'true' }}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
